services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: sensatez-libsql
    restart: unless-stopped
    environment:
      SQLD_NODE: primary
      SQLD_DB_PATH: /var/lib/sqld/sensatez.db
    ports:
      - "8081:8080"
    volumes:
      - libsql_data:/var/lib/sqld
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  libsql_data:
