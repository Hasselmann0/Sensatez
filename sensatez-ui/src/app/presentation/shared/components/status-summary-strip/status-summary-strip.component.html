<div
  class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 sm:gap-4 p-3 sm:py-3.5 sm:px-4 rounded-xl bg-white dark:bg-[#151519] border border-slate-200 dark:border-[#262630]"
>
  @for (item of items(); track item.label; let last = $last) {
    <div
      class="flex flex-col sm:pr-3 min-w-0"
      [ngClass]="{ 'lg:border-r lg:border-slate-200 dark:lg:border-[#262630]': !last }"
    >
      <div class="flex items-center gap-1.5 text-[11px] sm:text-xs text-slate-500 dark:text-zinc-400">
        <span class="w-2 h-2 rounded-full shrink-0" [style.backgroundColor]="item.dotColor"></span>
        <span class="truncate">{{ item.label }}</span>
        @if (item.tooltip) {
          <span
            class="text-[10px] text-slate-400 dark:text-zinc-500 cursor-help shrink-0"
            [title]="item.tooltip"
          >ⓘ</span>
        }
      </div>
      <div class="text-sm sm:text-base font-bold text-slate-900 dark:text-zinc-100 mt-0.5 sm:mt-1 truncate">
        {{ item.value }}
      </div>
    </div>
  }
</div>
